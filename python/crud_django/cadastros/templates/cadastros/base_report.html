<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Relatório{% endblock %}</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { 
            font-family: 'Inter', sans-serif;
            font-size: 14px; 
            background-color: #f8f9fa;
            color: #333;
        }
        
        /* Modern Report Container */
        .report-container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.05);
            padding: 2.5rem !important;
            margin-top: 2rem;
            margin-bottom: 2rem;
        }

        /* Typography & Headers */
        h2 {
            font-weight: 600;
            color: #2c3e50;
            letter-spacing: -0.5px;
        }
        
        /* Filter Section Styling */
        .filter-section {
            background: linear-gradient(145deg, #ffffff, #f8f9fa);
            border: 1px solid #eaeaea;
            border-radius: 8px;
            padding: 1.5rem;
        }
        
        .filter-section h5 {
            font-weight: 500;
            color: #495057;
            margin-bottom: 1.2rem;
            font-size: 1.1rem;
        }

        /* Buttons */
        .btn-primary {
            background-color: #4361ee;
            border-color: #4361ee;
            font-weight: 500;
            padding: 0.5rem 1.5rem;
            border-radius: 6px;
            transition: all 0.3s ease;
        }
        
        .btn-primary:hover {
            background-color: #3f37c9;
            border-color: #3f37c9;
            box-shadow: 0 4px 12px rgba(67, 97, 238, 0.2);
            transform: translateY(-1px);
        }

        .btn-secondary {
            background-color: #6c757d;
            border-radius: 6px;
            font-weight: 500;
        }

        /* Table Styling Overrides */
        .table {
            margin-top: 1.5rem;
        }
        
        .table thead th {
            background-color: #f8f9fa;
            color: #495057;
            font-weight: 600;
            text-transform: uppercase;
            font-size: 0.85rem;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #e9ecef;
            padding: 1rem 0.75rem;
        }
        
        .table tbody td {
            padding: 1rem 0.75rem;
            vertical-align: middle;
            color: #505d69;
        }
        
        .table-striped>tbody>tr:nth-of-type(odd)>* {
            background-color: rgba(248, 249, 250, 0.5);
        }

        .table-hover>tbody>tr:hover>* {
            background-color: rgba(67, 97, 238, 0.04);
        }

        .table-group-divider {
            border-top: 2px solid #e9ecef;
        }
        
        /* Total row styles */
        tfoot tr td {
            font-size: 1.05rem;
            padding: 0.75rem !important;
        }

        @media print {
            .no-print { display: none !important; }
            body { 
                font-size: 12px; 
                background-color: white;
            }
            .report-container {
                box-shadow: none;
                border: none;
                padding: 0 !important;
                margin: 0;
            }
            table { width: 100%; border-collapse: collapse; }
            th, td { border: 1px solid #ddd; padding: 8px; }
            th { background-color: #f2f2f2 !important; -webkit-print-color-adjust: exact; }
            .badge { border: 1px solid #000; color: #000; background-color: transparent !important; }
            tfoot tr td {
                border-top: 2px solid #000 !important;
            }
        }
    </style>
</head>
<body>
    <div class="container report-container">
        <div class="d-flex justify-content-between align-items-center mb-4 border-bottom pb-2 no-print">
            <h2>{% block report_title %}Relatório{% endblock %}</h2>
            <div>
                <a href="javascript:history.back()" class="btn btn-outline-secondary me-2 no-print">Voltar</a>
                <button class="btn btn-secondary no-print" onclick="window.print()">Imprimir</button>
            </div>
        </div>
        
        <div class="d-none d-print-block mb-4 text-center">
             <h2>{% block print_title %}Relatório{% endblock %}</h2>
             <p>Data de emissão: {% now "d/m/Y H:i" %}</p>
        </div>

        <div class="no-print mb-4 filter-section">
            <h5>Filtros</h5>
            <form method="get" class="row g-3">
                {% block filters %}{% endblock %}
                <div class="col-12 mt-3">
                    <button type="submit" class="btn btn-primary">Aplicar Filtros</button>
                    <a href="?" class="btn btn-outline-secondary">Limpar</a>
                </div>
            </form>
        </div>

        {% block report_content %}{% endblock %}
    </div>
</body>
</html>
