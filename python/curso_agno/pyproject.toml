[project]
name = "curso-agno"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Evandro Ribeiro", email = "eribeiro18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "agno>=3.1.2",
    "chonkie>=1.7.0",
    "chromadb>=1.5.9",
    "fastembed>=0.9.0",
    "google-genai>=2.29.0",
    "greenlet>=3.5.6",
    "groq>=1.7.0",
    "openai>=3.29.0",
    "pypdf>=6.20.0",
    "python-dotenv>=1.2.4",
    "sqlalchemy>=2.1.4",
    "tavily>=1.1.0",
    "tavily-python>=0.8.5",
    "yfinance>=1.7.0",
]

[project.scripts]
curso-agno = "curso_agno:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
