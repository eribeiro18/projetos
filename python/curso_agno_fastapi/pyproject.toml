[project]
name = "curso-agno-fastapi"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Evandro Ribeiro", email = "eribeiro18@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "chromadb>=1.5.9",
    "fastapi>=0.146.0",
    "openai>=3.35.1",
    "pypdf>=6.21.1",
    "sqlalchemy>=2.1.5",
    "streamlit>=1.66.0",
    "uvicorn>=0.54.0",
    "watchdog>=6.0.0",
]

[project.scripts]
curso-agno-fastapi = "curso_agno_fastapi:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"
